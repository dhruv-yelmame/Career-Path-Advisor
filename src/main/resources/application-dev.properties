# ==========================================
# DEVELOPMENT ENVIRONMENT CONFIGURATION
# ==========================================
spring.config.activate.on-profile=dev

# Database Connection (with env var fallback)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/career_path_adviser_new?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:8010865586}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
