# ==========================================
# APPLICATION GENERAL CONFIGURATION
# ==========================================
spring.application.name=CareerPathAdviser

# Active Profile
spring.profiles.active=dev

# Database Connection (with env var fallback)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/career_path_adviser?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:8010865586}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=careerPaths,tests,questions,dashboardStats


# Server Configuration
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# JWT Security Configurations
app.jwt.secret=${JWT_SECRET:CareerPathAdviserSecretKeyForJwtAuthentication2026SuperSecureKeyWithSufficientLength}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method